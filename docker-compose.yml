services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-springlite}
      POSTGRES_USER: ${DATABASE_USERNAME:-springlite}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-springlite}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-springlite} -d ${DATABASE_NAME:-springlite}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - springlite-postgres:/var/lib/postgresql

volumes:
  springlite-postgres:
